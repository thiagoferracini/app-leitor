<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Abastece Fácil - Frentista</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Área do Scanner */
        #reader {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Overlay de Controles Inferiores */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            border-top: 1px solid #38383A;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            z-index: 100;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-green { background-color: #30D158; }
        .btn-blue { background-color: #0A84FF; }
        .btn-red { background-color: #FF453A; }

        /* --- ESTILO DO POP-UP (MODAL) --- */
        #modal-overlay {
            display: none; /* Escondido por padrão */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            color: #000;
            width: 100%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title { font-weight: 700; font-size: 18px; margin-bottom: 10px; }
        .modal-data { 
            background: #F2F2F7; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 14px; 
            margin-bottom: 20px; 
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .btn-close {
            width: 100%;
            background: #007AFF;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="reader"></div>

    <div class="bottom-nav">
        <button id="main-btn" class="btn btn-green" onclick="toggleScanner()">INICIAR</button>
        <button id="switch-btn" class="btn btn-blue" onclick="switchCamera()" disabled>TROCAR</button>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Dados Lidos</div>
            <div class="modal-data" id="modal-text">Nenhuma informação.</div>
            <button class="btn-close" onclick="closeModal()">OK / PRÓXIMO</button>
        </div>
    </div>

    <script>
        let html5QrCode = new Html5Qrcode("reader");
        let isScanning = false;
        let currentCameraId;
        let cameras = [];

        function onScanSuccess(decodedText) {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Vibração dupla de sucesso
            
            // Pausa o scanner para o frentista ler o pop-up
            stopScanner();

            // Mostra o Pop-up
            document.getElementById('modal-text').innerText = decodedText;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            // Opcional: Reiniciar a câmera automaticamente após fechar
            // startScanner(); 
        }

        async function toggleScanner() {
            if (isScanning) {
                stopScanner();
            } else {
                startScanner();
            }
        }

        async function startScanner() {
            try {
                cameras = await Html5Qrcode.getCameras();
                if (cameras && cameras.length > 0) {
                    currentCameraId = cameras[cameras.length - 1].id;
                    await html5QrCode.start(currentCameraId, { fps: 10, qrbox: 250 }, onScanSuccess);
                    isScanning = true;
                    updateUI();
                    if (cameras.length > 1) document.getElementById('switch-btn').disabled = false;
                }
            } catch (err) {
                alert("Erro: Verifique se está usando HTTPS e deu permissão à câmera.");
            }
        }

        async function stopScanner() {
            if (!isScanning) return;
            await html5QrCode.stop();
            isScanning = false;
            updateUI();
        }

        async function switchCamera() {
            if (!isScanning) return;
            await html5QrCode.stop();
            let idx = cameras.findIndex(c => c.id === currentCameraId);
            currentCameraId = cameras[(idx + 1) % cameras.length].id;
            await html5QrCode.start(currentCameraId, { fps: 10, qrbox: 250 }, onScanSuccess);
        }

        function updateUI() {
            const btn = document.getElementById('main-btn');
            if (isScanning) {
                btn.innerText = "PARAR";
                btn.className = "btn btn-red";
            } else {
                btn.innerText = "ESCANEAR";
                btn.className = "btn btn-green";
            }
        }
    </script>
</body>
</html>
