<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Abastece Fácil - Frentista</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F2F2F7;
            color: #000;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; 
        }

        .header {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #C6C6C8;
            padding-top: calc(15px + env(safe-area-inset-top));
            z-index: 10;
        }

        #scanner-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            position: relative;
            z-index: 1;
        }

        #reader { width: 100%; height: 100%; }

        /* Painel Inferior Ajustado */
        .controls {
            background-color: #fff;
            padding: 20px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 10;
            max-height: 50%; /* Garante que o painel não cubra a câmera toda */
            display: flex;
            flex-direction: column;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-success { background-color: #34C759; color: white; }
        .btn-primary { background-color: #007AFF; color: white; }
        .btn:disabled { background-color: #D1D1D6; color: #8E8E93; }

        /* AREA DE RESULTADO COM SCROLL */
        #result-panel {
            background-color: #F2F2F7;
            padding: 15px;
            border-radius: 14px;
            flex: 1;
            overflow-y: auto; /* PERMITE ROLAR SE O TEXTO FOR GRANDE */
            border: 1px solid #E5E5EA;
            -webkit-overflow-scrolling: touch; /* Scroll suave no iOS */
        }

        .result-header {
            font-size: 11px;
            font-weight: 700;
            color: #8E8E93;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #scanned-result {
            font-size: 14px;
            line-height: 1.5;
            color: #1C1C1E;
            word-break: break-all; /* Força quebra de links longos */
        }

        .success-badge {
            background: #E8F9EE;
            color: #248A3D;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 style="font-size: 17px;">Abastece Fácil</h1>
        <p style="font-size: 12px; color: #8E8E93;">Sistema de Identificação</p>
    </header>

    <main id="scanner-container">
        <div id="reader"></div>
    </main>

    <footer class="controls">
        <div class="button-group">
            <button id="start-stop-btn" class="btn btn-success" onclick="toggleScanner()">
                <span id="btn-text">ESCANEAR</span>
            </button>
            <button id="switch-camera-btn" class="btn btn-primary" onclick="switchCamera()" disabled>
                <span>TROCAR</span>
            </button>
        </div>

        <div id="result-panel">
            <div class="result-header">Dados do Cliente / Nota</div>
            <div id="scanned-result">
                <span style="color: #C7C7CC;">Aguardando leitura...</span>
            </div>
        </div>
    </footer>

    <script>
        let html5QrCode;
        let isScanning = false;
        let currentCameraId;
        let cameras = [];

        html5QrCode = new Html5Qrcode("reader");

        function onScanSuccess(decodedText, decodedResult) {
            if (navigator.vibrate) navigator.vibrate(100);

            const resultElement = document.getElementById('scanned-result');
            // Aqui ele limpa o "Aguardando" e coloca o conteúdo real com scroll habilitado
            resultElement.innerHTML = `
                <div class="success-badge">LEITURA OK</div>
                <div style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #D1D1D6;">
                    ${decodedText}
                </div>
            `;
            
            // Opcional: Parar a câmera após ler para economizar bateria
            // stopScanner(); 
        }

        function onScanFailure(error) {}

        function toggleScanner() {
            isScanning ? stopScanner() : startScanner();
        }

        async function startScanner() {
            try {
                cameras = await Html5Qrcode.getCameras();
                if (cameras && cameras.length > 0) {
                    currentCameraId = cameras[cameras.length - 1].id;
                    const config = { fps: 15, qrbox: { width: 250, height: 250 } };
                    await html5QrCode.start(currentCameraId, config, onScanSuccess, onScanFailure);
                    isScanning = true;
                    updateUI();
                    if (cameras.length > 1) document.getElementById('switch-camera-btn').disabled = false;
                }
            } catch (err) {
                alert("Verifique as permissões de câmera (HTTPS necessário).");
            }
        }

        async function stopScanner() {
            if (!isScanning) return;
            await html5QrCode.stop();
            isScanning = false;
            updateUI();
        }

        async function switchCamera() {
            if (!isScanning || cameras.length <= 1) return;
            await html5QrCode.stop();
            const currentIndex = cameras.findIndex(cam => cam.id === currentCameraId);
            currentCameraId = cameras[(currentIndex + 1) % cameras.length].id;
            await html5QrCode.start(currentCameraId, { fps: 15, qrbox: 250 }, onScanSuccess, onScanFailure);
        }

        function updateUI() {
            const btn = document.getElementById('start-stop-btn');
            const btnText = document.getElementById('btn-text');
            if (isScanning) {
                btn.style.backgroundColor = "#FF3B30"; // Vermelho para Parar
                btnText.innerText = "PARAR";
            } else {
                btn.style.backgroundColor = "#34C759"; // Verde para Iniciar
                btnText.innerText = "ESCANEAR";
            }
        }
    </script>
</body>
</html>
