<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scanner Ailog - Manual</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        #video-container { position: relative; width: 100%; height: 100%; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Moldura de enquadramento */
        #guide-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 180px; border: 2px solid rgba(255,255,255,0.5); border-radius: 15px;
            z-index: 5; pointer-events: none;
        }
        #guide-box::after {
            content: "POSICIONE OS NÚMEROS AQUI"; font-size: 10px; color: #fff;
            position: absolute; bottom: -25px; width: 100%; text-align: center;
        }

        /* Botão de Tirar Foto (Círculo centralizado embaixo) */
        .shutter-button {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; background: white; border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%; z-index: 10; cursor: pointer;
        }
        .shutter-button:active { transform: translateX(-50%) scale(0.9); }

        /* Overlay de Carregamento e Resultado */
        #status-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; 
        }
        
        .result-card { background: white; color: black; width: 90%; max-width: 350px; border-radius: 20px; padding: 25px; text-align: left; }
        .label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; display: block; margin-top: 10px; }
        .value { font-size: 18px; font-weight: bold; color: #1c1c1e; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #30D158; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .btn-reset { background: #007AFF; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <div id="guide-box"></div>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- O BOTÃO DE BATER FOTO -->
    <div class="shutter-button" onclick="capturarAgora()"></div>

    <div id="status-overlay">
        <div id="loader-area" style="text-align: center;">
            <div class="loader"></div>
            <p>Lendo dados do cartão...</p>
        </div>

        <div id="result-area" class="result-card" style="display: none;">
            <h2 id="res-status" style="margin-bottom: 15px;">---</h2>
            <span class="label">Número Identificado</span>
            <span id="res-id" class="value" style="color: #007AFF;">---</span>
            <span class="label">Placa</span>
            <span id="res-placa" class="value">---</span>
            <span class="label">Cliente</span>
            <span id="res-cliente" class="value">---</span>
            <button class="btn-reset" onclick="resetar()">NOVA LEITURA</button>
        </div>
    </div>

    <script>
        // SUBSTITUA PELO SEU LINK DO GOOGLE
        const webAppUrl = "https://script.google.com/macros/s/AKfycbxTw2OLtgQQ5ibAE4jF_dXdEao581W8a5Mr8vKWt22yie4wU3-rsdMx-MbhMtdBG7Y1/exec"; 

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const overlay = document.getElementById('status-overlay');

        // Inicia câmera
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", focusMode: "continuous" } 
        }).then(stream => video.srcObject = stream);

        async function capturarAgora() {
            // Mostra o "carregando"
            overlay.style.display = 'flex';
            document.getElementById('loader-area').style.display = 'block';
            document.getElementById('result-area').style.display = 'none';

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // PRE-PROCESSAMENTO: Aumenta o contraste para o cartão laranja
            ctx.filter = 'contrast(200%) grayscale(100%)';
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                // Tesseract lê a foto batida
                const result = await Tesseract.recognize(canvas.toDataURL('image/png'), 'eng');
                const textoLido = result.data.text.replace(/\D/g, ''); // Pega só os números

                if (textoLido.length >= 8) {
                    buscarNaPlanilha(textoLido);
                } else {
                    exibirErro("Não consegui ler os números. Tente aproximar mais.");
                }
            } catch (e) {
                exibirErro("Erro ao processar imagem.");
            }
        }

        function buscarNaPlanilha(id) {
            fetch(`${webAppUrl}?id=${id}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('loader-area').style.display = 'none';
                    document.getElementById('result-area').style.display = 'block';
                    
                    if (data.error) {
                        document.getElementById('res-status').innerText = "Não Cadastrado";
                        document.getElementById('res-id').innerText = id;
                        document.getElementById('res-placa').innerText = "Verifique a base";
                    } else {
                        document.getElementById('res-status').innerText = "Localizado!";
                        document.getElementById('res-id').innerText = id;
                        document.getElementById('res-placa').innerText = data.placa;
                        document.getElementById('res-cliente').innerText = data.cliente;
                    }
                }).catch(() => exibirErro("Erro de conexão."));
        }

        function exibirErro(msg) {
            document.getElementById('loader-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('res-status').innerText = "Falha";
            document.getElementById('res-id').innerText = msg;
        }

        function resetar() {
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
